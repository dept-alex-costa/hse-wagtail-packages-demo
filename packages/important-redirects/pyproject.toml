[tool.poetry]
name = "hse-demo-important-redirects"
version = "1.0.3"
description = "Example module for independent releases in the wagtail6 compatibility line."
authors = ["DEPT Demo <demo@example.com>"]
readme = "README.md"
packages = [{ include = "hse_demo_redirects", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = ">=4.2.26,<4.3"
wagtail = ">=6.4,<6.5"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

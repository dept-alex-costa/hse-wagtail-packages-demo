name: Release package
run-name: Release ${{ github.ref_name }} / ${{ inputs.package }} (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      package:
        description: Module to release from the selected branch
        required: true
        type: choice
        options: [component_lib, important_redirects]
      bump:
        description: Increment the selected module's own version
        required: true
        type: choice
        options: [current, patch, minor, custom]
      custom_version:
        description: Required for custom only, for example 2.3.1
        required: false
        type: string

permissions:
  contents: write

# Releases for different modules can write the same branch.
concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: '2.2.1'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  POETRY_NO_INTERACTION: '1'

jobs:
  release:
    name: Release ${{ github.ref_name }} / ${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a release branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REF" != 'refs/heads/main' ] && [ "$SOURCE_REF" != 'refs/heads/legacy/wagtail-6-django-4' ]; then
            echo 'Final releases must run from main or legacy/wagtail-6-django-4.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Validate release controls
        run: python -m unittest discover -s tests -v
      - name: Resolve branch, module, version and tag
        id: package
        env:
          BRANCH: ${{ github.ref_name }}
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          python scripts/release.py prepare \
            --branch "$BRANCH" --package "$PACKAGE" --bump "$BUMP" \
            --custom-version "$CUSTOM_VERSION" \
            --github-output "$GITHUB_OUTPUT" --plan-file .release/plan.json
      - name: Validate selected package and build release artifacts
        env:
          LINE: ${{ steps.package.outputs.line }}
          PACKAGE: ${{ inputs.package }}
        run: python scripts/check_package.py --line "$LINE" --package "$PACKAGE"
      - name: Commit selected module's version bump
        if: steps.package.outputs.changed == 'true'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE_PATH/pyproject.toml" "$PACKAGE_PATH/poetry.lock"
          git commit -m "Release $TAG"
      - name: Generate release notes for this line and module
        run: python scripts/release.py notes --plan-file .release/plan.json --output .release/notes.md
      - name: Push version commit and tag atomically
        env:
          BRANCH: ${{ steps.package.outputs.branch }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a --cleanup=verbatim "$TAG" -F .release/notes.md
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"
      - name: Create GitHub Release with wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release create "$TAG" "$PACKAGE_PATH"/dist/* \
            --verify-tag --latest=false --title "$TAG" --notes-file .release/notes.md
      - name: Summarise release
        env:
          BRANCH: ${{ steps.package.outputs.branch }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- Module: \`$PACKAGE_PATH\`"
            echo "- Version: \`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

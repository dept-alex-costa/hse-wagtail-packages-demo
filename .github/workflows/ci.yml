name: CI

on:
  pull_request:
    branches: [main, legacy-main]
  push:
    branches: [main, legacy-main]
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_VERSION: '2.2.1'
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'
  POETRY_NO_INTERACTION: '1'
  TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}

jobs:
  release-checks:
    name: Release controls
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.branch.outputs.line }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the compatibility line
        id: branch
        run: |
          line=$(python scripts/release.py line-for-branch --branch "$TARGET_BRANCH")
          echo "line=$line" >> "$GITHUB_OUTPUT"
      - name: Test independent versioning and release controls
        run: python -m unittest discover -s tests -v
      - name: Prevent manual package version bumps in PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/release.py check-pr --base "$BASE_SHA" --branch "$TARGET_BRANCH"

  package-checks:
    name: Package checks (${{ needs.release-checks.outputs.line }}, ${{ matrix.package }})
    needs: release-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [component_lib, important_redirects]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Poetry
        run: pipx install "poetry==$POETRY_VERSION"
      - name: Validate lock, install, build and check installed wheel
        env:
          LINE: ${{ needs.release-checks.outputs.line }}
          PACKAGE: ${{ matrix.package }}
        run: python scripts/check_package.py --line "$LINE" --package "$PACKAGE"
